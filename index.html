<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Golden Wolf — الحضور</title>

<style>
:root{--bg:#0b0b0e;--surface:#15151a;--surface2:#1d1d24;--line:#2a2a33;--txt:#f5f1e6;--mut:#9a968a;--gold:#e0b341;--gold2:#b98a1c;--ok:#35c07a;--out:#4c8dff;--bad:#e5584f;--warn:#e0a13a;--r:18px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:17px;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mut{color:var(--mut)}
/* ---------- الترويسة ---------- */
.top{position:sticky;top:0;z-index:5;background:rgba(11,11,14,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + var(--st)) 14px 10px}
.mono{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#f0cc62,#b98a1c);color:#1b1304;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;letter-spacing:.5px;flex:0 0 auto;box-shadow:0 2px 10px #e0b34133}
.ttl{min-width:0}
.ttl b{display:block;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--mut);font-size:13px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt)}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 4px 6px;text-align:center;font-size:13px;color:var(--mut);position:relative;overflow:hidden}
.stat b{display:block;font-size:22px;line-height:1.15;color:var(--txt)}
.stat::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--mut);opacity:.5}
.stat.in::after{background:var(--ok);opacity:1}.stat.out::after{background:var(--out);opacity:1}
.stat.in b{color:var(--ok)}.stat.out b{color:var(--out)}
.srch{position:relative;margin-top:10px}
.srch svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--mut);width:20px;height:20px}
input.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;padding-inline-start:40px;outline:none}
input.search:focus{border-color:var(--gold2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 15px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
/* ---------- القائمة ---------- */
.warn{margin:10px 12px 0;background:#2d2210;color:#ffd48a;border:1px solid #5b4416;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7}
.hint{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--mut);font-size:13px;padding:12px 10px 4px;white-space:nowrap}
.hint span{display:inline-flex;align-items:center;gap:5px}
.hint .g{color:var(--ok)}.hint .b{color:var(--out)}
#list{padding:8px 12px calc(110px + var(--sb));display:grid;gap:10px;max-width:1100px;margin:0 auto}
@media(min-width:880px){#list{grid-template-columns:1fr 1fr}}
.swrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface)}
.bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:700;font-size:18px;color:#fff}
.bg.r{background:linear-gradient(90deg,#1c7a4a,var(--ok))}.bg.l{background:linear-gradient(270deg,#2a62c9,var(--out))}
.person{position:relative;display:flex;align-items:center;gap:13px;background:var(--surface);padding:11px 13px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:1px solid var(--line);border-radius:var(--r);transition:transform .18s,background .3s}
.person.drag{transition:none}
.person.flash{animation:fl 1s ease-out}
@keyframes fl{0%{background:#25331f}100%{background:var(--surface)}}
.person.peek{animation:pk 1.6s .6s ease-in-out 1}
@keyframes pk{0%,100%{transform:none}30%{transform:translateX(46px)}60%{transform:translateX(-46px)}}
.av{position:relative;flex:0 0 auto;width:66px;height:66px;border-radius:50%;padding:3px;background:var(--line)}
.av.in{background:conic-gradient(var(--ok),#7be3ad,var(--ok))}.av.out{background:conic-gradient(var(--out),#9bc0ff,var(--out))}
.ph{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--surface2);border:2px solid var(--surface)}
.ph.noimg{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px;font-weight:700}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:18px;line-height:1.35}
.nm small{color:var(--mut);font-size:13.5px}
.st{flex:0 0 auto;text-align:center;min-width:78px;border-radius:12px;padding:6px 9px;font-size:13.5px;background:var(--surface2);color:var(--mut);line-height:1.4}
.st b{display:block;font-size:15px;color:inherit}
.st.in{background:#12382a;color:#8ee5ae}.st.out{background:#14274a;color:#a8c9ff}
.sub{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12.5px;margin-top:3px}
.sub.paid{background:#12382a;color:#8ee5ae}.sub.part{background:#43330f;color:#ffd48a}.sub.un{background:#4a1c1c;color:#ffb0b0}
.empty{text-align:center;color:var(--mut);padding:50px 14px;grid-column:1/-1}

.fab{position:fixed;inset-inline:0;bottom:calc(12px + var(--sb));display:flex;justify-content:center;z-index:6;pointer-events:none}

.dock .btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:76px;padding:8px 12px;font-size:12.5px;border-radius:16px;position:relative}
.dock .btn.pri{background:linear-gradient(145deg,#f0cc62,var(--gold2))}
.dock .n{position:absolute;top:2px;inset-inline-start:6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px 16px;color:var(--txt)}
.btn.pri{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.btn.ok{background:#16603c;border-color:#1f8a55;color:#fff;font-weight:700}
.btn.out{background:#1e4a9c;border-color:#2d68d6;color:#fff;font-weight:700}
.btn.bad{background:#3a1d1d;border-color:#6b2c2c;color:#ffb0b0}
.btn.blk{width:100%}
/* ---------- النوافذ ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fi .18s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;width:min(720px,100%);max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 16px calc(16px + var(--sb));animation:su .22s ease-out}
@keyframes su{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0;font-size:21px;line-height:1.3}
.sheet h3{margin:0 0 8px;font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.2px}
.hero{display:flex;gap:14px;align-items:center}
.big{width:104px;height:124px;border-radius:20px;object-fit:cover;background:var(--surface2);flex:0 0 auto;border:2px solid var(--line)}
.big.noimg{display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--mut)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.acts .btn{padding:14px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:baseline}
.kv span{color:var(--mut);font-size:14px}
.kv div{word-break:break-word}
.bar{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.bar.full i{background:linear-gradient(90deg,#1c7a4a,var(--ok))}
.call{display:inline-flex;align-items:center;gap:6px;direction:ltr;color:#9cc4ff;text-decoration:none;background:#14233d;border-radius:10px;padding:3px 10px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--mut);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
select,textarea,.sheet input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0;outline:none}
.toast{position:fixed;top:calc(12px + var(--st));inset-inline:14px;margin:auto;max-width:480px;background:#26262e;border:1px solid var(--line);border-radius:14px;padding:12px 16px;z-index:40;text-align:center;box-shadow:0 8px 24px #000a;animation:fi .15s}
/* ---------- شاشة القفل ---------- */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,#2a2209,transparent 70%)}
.lock .box{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px 22px;width:min(400px,100%);text-align:center;box-shadow:0 20px 50px #000a}
.lock .mono{width:76px;height:76px;font-size:28px;margin:0 auto 14px}
.lock h1{font-size:21px;margin:0 0 4px}
.lock input[type=password],.lock input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0 8px;text-align:center;outline:none;font-size:18px}
.lock input:focus{border-color:var(--gold2)}
.lock label{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mut);font-size:14px;margin:6px 0 14px}
.lock .msg{min-height:22px;color:var(--bad);font-size:15px;margin-top:10px}
.lock .btn.pri{padding:14px;font-size:18px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:sp 0.9s linear infinite;margin:16px auto}
@keyframes sp{to{transform:rotate(360deg)}}
a{color:#9cc4ff}
</style>
</head>

    crypto.subtle.importKey('raw', hex(EX_KEY), 'AES-GCM', false, ['encrypt']).then(function (k) { return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(JSON.stringify(doc))); }).then(function (ct) {
      var head = new TextEncoder().encode('GWA1'), out = new Uint8Array(4 + 12 + ct.byteLength); out.set(head, 0); out.set(iv, 4); out.set(new Uint8Array(ct), 16);
      var name = 'GoldenWolf-' + todayStr() + '-' + nowLocal().slice(11, 16).replace(':', '') + '.gwatt';
      function done() { ST.exportedN = nE; ST.exportedI = nI; ST.lastExportAt = nowLocal(); save(); render(true); toast('تم إنشاء ملف الحضور: ' + nE + ' تسجيل، ' + nI + ' حادثة'); }
      function download() { var blob = new Blob([out], { type: 'application/octet-stream' }), a = h('a', { href: URL.createObjectURL(blob), download: name }); document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500); done(); }
      var file = null; try { file = new File([out], name, { type: 'application/octet-stream' }); } catch (e) { /* */ }
      if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'ملف الحضور' }).then(done).catch(function (err) { if (err && err.name === 'AbortError') return; download(); });
      } else download();
    }).catch(function (e) { toast('تعذّر التصدير: ' + e); });
  }

  start();
})();
</script>
