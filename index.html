<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الحضور">
<title>Golden Wolf — الحضور</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
:root[data-theme=light]{--bg:#f4f1e9;--surface:#ffffff;--surface2:#ece7da;--line:#ddd6c4;--txt:#1d1a12;--mut:#6f6a5c;--gold:#c8931a;--gold2:#a8780f}
:root[data-theme=light] .top{background:rgba(244,241,233,.97)}
:root[data-theme=light] .dock{background:rgba(255,255,255,.94)}
:root[data-theme=light] .st.in,:root[data-theme=light] .sub.paid{background:#d9f3e4;color:#14683c}:root[data-theme=light] .st.out{background:#dce8ff;color:#1d4fa3}:root[data-theme=light] .sub.part{background:#fbefcf;color:#7a5a08}:root[data-theme=light] .sub.un{background:#fbdcdc;color:#9b2c2c}
:root[data-theme=light] .ov{background:rgba(30,25,10,.45)}
:root{--bg:#0b0b0e;--surface:#15151a;--surface2:#1d1d24;--line:#2a2a33;--txt:#f5f1e6;--mut:#9a968a;--gold:#e0b341;--gold2:#b98a1c;--ok:#35c07a;--out:#4c8dff;--bad:#e5584f;--warn:#e0a13a;--r:18px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:17px;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mut{color:var(--mut)}
/* ---------- الترويسة ---------- */
.top{position:sticky;top:0;z-index:5;background:rgba(11,11,14,.97);border-bottom:1px solid var(--line);padding:calc(10px + var(--st)) 14px 10px}
.mono img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.mono.lg{overflow:hidden}
.mono{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#f0cc62,#b98a1c);color:#1b1304;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;letter-spacing:.5px;flex:0 0 auto;box-shadow:0 2px 10px #e0b34133}
.ttl{min-width:0}
.ttl b{display:block;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--mut);font-size:13px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt)}
.stats{display:flex;gap:8px;margin-top:8px}
.stat{cursor:pointer;font-family:inherit;flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 4px 6px;text-align:center;font-size:13px;color:var(--mut);position:relative;overflow:hidden}
.stat b{display:block;font-size:22px;line-height:1.15;color:var(--txt)}
.stat::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--mut);opacity:.5}
.stat.act{box-shadow:0 0 0 2px var(--gold) inset}
.stat.in::after{background:var(--ok);opacity:1}.stat.out::after{background:var(--out);opacity:1}
.stat.in b{color:var(--ok)}.stat.out b{color:var(--out)}
.srch{position:relative;margin-top:10px}
.srch svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--mut);width:20px;height:20px}
input.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;padding-inline-start:40px;outline:none}
input.search:focus{border-color:var(--gold2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 15px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
/* ---------- القائمة ---------- */
.top{position:sticky}
.sess{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;color:var(--txt);font-weight:700;font-size:18px;line-height:1.3;max-width:100%}
.sess span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess svg{width:16px;height:16px;color:var(--gold);flex:0 0 auto}
.ttl em{display:block;font-style:normal;font-size:12px;color:var(--gold);letter-spacing:.3px}
.filters{padding:10px 14px 0;max-width:1100px;margin:0 auto}
.lbl{font-size:12.5px;color:var(--mut);margin:10px 2px 0}
.chip small{opacity:.75;margin-inline-start:4px}
.chip.f{border-style:dashed}.chip.f.on{border-style:solid}
.gsec{padding:0 12px;max-width:1100px;margin:0 auto 10px}
.gsec h3{margin:6px 4px 8px;font-size:14px;color:var(--gold)}
.sy{flex:0 0 auto;font-size:12px;border-radius:999px;padding:4px 10px;background:var(--surface);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.sy.ok{color:var(--ok);border-color:#1f6a45}.sy.wait{color:var(--warn);border-color:#6b5320}.sy.off{color:var(--bad);border-color:#6b2c2c}
.big .swrap{content-visibility:auto;contain-intrinsic-size:auto 108px}
.guest{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px dashed var(--gold2);border-radius:var(--r);padding:11px 13px;margin-bottom:8px}
.guest .ga{width:46px;height:46px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:0 0 auto}
.warn{margin:10px 12px 0;background:#2d2210;color:#ffd48a;border:1px solid #5b4416;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7}
.hint{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--mut);font-size:13px;padding:12px 10px 4px;white-space:nowrap}
.hint span{display:inline-flex;align-items:center;gap:5px}
.hint .g{color:var(--ok)}.hint .b{color:var(--out)}
#list{padding:8px 12px calc(110px + var(--sb));display:grid;gap:10px;max-width:1100px;margin:0 auto}
@media(min-width:880px){#list{grid-template-columns:1fr 1fr}}
.swrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface)}
.bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:700;font-size:18px;color:#fff}
.bg.r{background:linear-gradient(90deg,#1c7a4a,var(--ok))}.bg.l{background:linear-gradient(270deg,#2a62c9,var(--out))}
.person{position:relative;display:flex;align-items:center;gap:13px;background:var(--surface);padding:11px 13px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:1px solid var(--line);border-radius:var(--r);transition:transform .18s,background .3s}
.person.drag{transition:none}
.person.flash{animation:fl 1s ease-out}
@keyframes fl{0%{background:#25331f}100%{background:var(--surface)}}
.person.peek{animation:pk 1.6s .6s ease-in-out 1}
@keyframes pk{0%,100%{transform:none}30%{transform:translateX(46px)}60%{transform:translateX(-46px)}}
.av{position:relative;flex:0 0 auto;width:66px;height:66px;border-radius:50%;padding:3px;background:var(--line)}
.av.in{background:conic-gradient(var(--ok),#7be3ad,var(--ok))}.av.out{background:conic-gradient(var(--out),#9bc0ff,var(--out))}
.ph{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--surface2);border:2px solid var(--surface)}
.ph.noimg{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px;font-weight:700}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:18px;line-height:1.35}
.nm small{color:var(--mut);font-size:13.5px}
.st{flex:0 0 auto;text-align:center;min-width:78px;border-radius:12px;padding:6px 9px;font-size:13.5px;background:var(--surface2);color:var(--mut);line-height:1.4}
.st b{display:block;font-size:15px;color:inherit}
.st.in{background:#12382a;color:#8ee5ae}.st.out{background:#14274a;color:#a8c9ff}
.sub{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12.5px;margin-top:3px}
.sub.paid{background:#12382a;color:#8ee5ae}.sub.part{background:#43330f;color:#ffd48a}.sub.un{background:#4a1c1c;color:#ffb0b0}
.go{flex:0 0 auto;min-width:84px;border-radius:14px;padding:12px 10px;font-weight:700;font-size:15px;border:0;color:#fff;box-shadow:0 2px 8px #0005}
.go.in{background:linear-gradient(145deg,#2fbf79,#1c8a55)}.go.out{background:linear-gradient(145deg,#4c8dff,#2a62c9)}
.kit{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12.5px;margin-top:3px;margin-inline-start:4px}
.kit.ok{background:#12382a;color:#8ee5ae}.kit.part{background:#2c2f55;color:#b5bcff}.kit.none{background:var(--surface2);color:var(--mut)}
.nm .st{display:inline-block;min-width:0;padding:2px 9px;margin-top:3px;font-size:13px;border-radius:9px}
.tabs2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;margin:14px 0 4px}
.tabs2 button{border:0;background:transparent;border-radius:12px;padding:10px 4px;font-weight:600;color:var(--mut)}
.tabs2 button.on{background:var(--gold);color:#1a1405}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:var(--surface2);border-radius:14px;padding:10px 6px;text-align:center}
.tile small{display:block;color:var(--mut);font-size:12.5px;margin-bottom:2px}
.tile b{display:block;font-size:17px;line-height:1.35}
.tile b bdi{unicode-bidi:isolate;direction:ltr}.tile b i{font-style:normal;font-size:12px;color:var(--mut);display:block}
.tile.ok b{color:var(--ok)}.tile.rest b{color:var(--warn)}.tile.zero b{color:var(--ok)}
.krow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.krow:last-child{border-bottom:0}
.krow .kn{flex:1;font-size:17px}.krow .kn small{display:block;color:var(--mut);font-size:13px}
.tg{position:relative;width:56px;height:32px;border-radius:16px;background:var(--line);border:0;flex:0 0 auto;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--ok)}.tg.on::after{left:27px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes button{min-width:54px;padding:10px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.sizes button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:50px 14px;grid-column:1/-1}
/* ---------- الشريط السفلي ---------- */
.fab{position:fixed;inset-inline:0;bottom:calc(12px + var(--sb));display:flex;justify-content:center;z-index:6;pointer-events:none}
.dock{pointer-events:auto;display:flex;gap:6px;background:rgba(28,28,34,.97);border:1px solid var(--line);border-radius:22px;padding:7px;box-shadow:0 10px 30px #000a}
.dock .btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:76px;padding:8px 12px;font-size:12.5px;border-radius:16px;position:relative}
.dock .btn.pri{background:linear-gradient(145deg,#f0cc62,var(--gold2))}
.dock .n{position:absolute;top:2px;inset-inline-start:6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px 16px;color:var(--txt)}
.btn.pri{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.btn.ok{background:#16603c;border-color:#1f8a55;color:#fff;font-weight:700}
.btn.out{background:#1e4a9c;border-color:#2d68d6;color:#fff;font-weight:700}
.btn.bad{background:#3a1d1d;border-color:#6b2c2c;color:#ffb0b0}
.btn.blk{width:100%}
/* ---------- النوافذ ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fi .18s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;width:min(720px,100%);max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 16px calc(16px + var(--sb));animation:su .22s ease-out}
@keyframes su{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0;font-size:21px;line-height:1.3}
.sheet h3{margin:0 0 8px;font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.2px}
.hero{display:flex;gap:14px;align-items:center}
.big{width:104px;height:124px;border-radius:20px;object-fit:cover;background:var(--surface2);flex:0 0 auto;border:2px solid var(--line)}
.big.noimg{display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--mut)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.acts .btn{padding:14px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:baseline}
.kv span{color:var(--mut);font-size:14px}
.kv div{word-break:break-word}
.bar{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.bar.full i{background:linear-gradient(90deg,#1c7a4a,var(--ok))}
.call{display:inline-flex;align-items:center;gap:6px;direction:ltr;color:#9cc4ff;text-decoration:none;background:#14233d;border-radius:10px;padding:3px 10px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--mut);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
select,textarea,.sheet input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0;outline:none}
.toast{position:fixed;top:calc(12px + var(--st));inset-inline:14px;margin:auto;max-width:480px;background:#26262e;border:1px solid var(--line);border-radius:14px;padding:12px 16px;z-index:40;text-align:center;box-shadow:0 8px 24px #000a;animation:fi .15s}
/* ---------- شاشة القفل ---------- */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,#2a2209,transparent 70%)}
.lock .box{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px 22px;width:min(400px,100%);text-align:center;box-shadow:0 20px 50px #000a}
.lock .mono{width:76px;height:76px;font-size:28px;margin:0 auto 14px}
.lock h1{font-size:21px;margin:0 0 4px}
.lock input[type=password],.lock input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0 8px;text-align:center;outline:none;font-size:18px}
.lock input:focus{border-color:var(--gold2)}
.lock label{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mut);font-size:14px;margin:6px 0 14px}
.lock .msg{min-height:22px;color:var(--bad);font-size:15px;margin-top:10px}
.lock .btn.pri{padding:14px;font-size:18px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:sp 0.9s linear infinite;margin:16px auto}
@keyframes sp{to{transform:rotate(360deg)}}
a{color:#9cc4ff}
/* ---------- v1.10: تنقل سفلي، ديون، مدربون ---------- */
.av{width:54px;height:54px;padding:2px}
.person{padding:9px 11px;gap:11px}
.nm b{font-size:17px}
.go{min-width:76px;padding:11px 8px}
.xb{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--mut);display:inline-flex;align-items:center;justify-content:center;margin-inline-start:6px;vertical-align:middle;padding:0}
.xb svg{width:16px;height:16px}
.qa{display:flex;gap:8px;margin-top:8px}.qa .btn{flex:1;padding:9px 6px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:6;display:flex;background:rgba(21,21,26,.98);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sb))}
:root[data-theme=light] .nav{background:rgba(255,255,255,.97)}
.nav button{flex:1;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12.5px;color:var(--mut);position:relative;border-radius:12px}
.nav button.on{color:var(--gold);font-weight:700}
.nav .n{position:absolute;top:0;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#list{padding-bottom:calc(86px + var(--sb))}
.sumbox{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sumbox .big2{font-size:26px;font-weight:800;color:var(--bad);line-height:1.3}.sumbox .big2.z{color:var(--ok)}
.sumbox small{color:var(--mut);display:block}
.brh{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;margin:8px 4px 0;color:var(--gold);font-weight:700}
.brh span{margin-inline-start:auto;color:var(--bad)}
.sqrow{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.sqrow .r1{display:flex;align-items:center;gap:8px}.sqrow b{font-size:17px}.sqrow .amt{margin-inline-start:auto;font-weight:800;color:var(--bad)}.sqrow .amt.z{color:var(--ok)}
.sqrow small{color:var(--mut)}
.debt{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
.debt .amt{flex:0 0 auto;text-align:center;font-weight:800;color:var(--bad);font-size:16px;line-height:1.3}.debt .amt small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.dbn{margin-top:10px;border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.7}
.dbn.rest{background:#4a1c1c;color:#ffb0b0}.dbn.ok{background:#12382a;color:#8ee5ae}
:root[data-theme=light] .dbn.rest{background:#fde3e3;color:#9b2323}:root[data-theme=light] .dbn.ok{background:#d9f3e4;color:#14683c}
.cday{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:12px}
.cday button{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.cday b{min-width:150px;text-align:center}
.coachc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.coachc .t{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.coachc .t b{font-size:18px}.coachc .t small{color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 4px;font-weight:700;color:var(--txt)}
.seg button.on.p{background:#16603c;border-color:#1f8a55;color:#fff}.seg button.on.a{background:#8a2b2b;border-color:#c04444;color:#fff}.seg button.on.e{background:#7a5a14;border-color:#b98a1c;color:#fff}
.toast.act{display:flex;align-items:center;gap:12px;justify-content:space-between;top:auto;bottom:calc(76px + var(--sb))}

  /* ---------- الحفظ المحلي + مخزن السجلات (كل سجل له نسخة r والأحدث يغلب، لتتزامن الأجهزة) ---------- */
  function load() {

  }
  function migrateOld() {
    var nE = ST.exportedN || 0, nI = ST.exportedI || 0, nK = ST.exportedK || 0, dev = ST.device || lsGet('gw.device') || 'dev';
    function add(c, x, ex, u) { var r = Date.parse(x.at) || Date.now(), rec = { c: c, u: u || x.uid, r: r, dev: dev, x: x }; if (ex) rec.ex = r; ST.store[c + ':' + rec.u] = rec; }

  }

  /* ---------- جلب الملف + فتحه (كلمة مرور) ---------- */

  function screenLock(enc) {

    app.appendChild(h('div', { class: 'lock' }, h('div', { class: 'box' }, logoEl(true), h('h1', null, 'تسجيل الحضور'), h('div', { class: 'mut', style: 'font-size:15px' }, 'أدخل كلمة المرور لفتح قائمة المنخرطين'), pw,

    var sq = (PKG.squads || []).filter(function (s) { return PKG.members.some(function (m) { return m.enrollments.some(function (e) { return e.is_current && e.squad_id === s.id; }); }); });

  /* ---------- حالة اليوم ---------- */

        if (q && (m._s || (m._s = m.display_name + ' ' + m.full_name)).indexOf(q) < 0) return;

  /* ---------- التسجيل ---------- */

  function cpath(rec) { return rec.c === 'kit' ? 'k/kit-' + san(rec.u) : 'd/' + (rec.c === 'se' ? rec.u : String(rec.x && rec.x.at || todayStr()).slice(0, 10)) + '/' + rec.c + '-' + san(rec.u); }
  function badge() {
    var el = UI && UI.sy; if (!el) return; if (!SY.on) { el.style.display = 'none'; return; } el.style.display = '';
    var n = ST.outbox.length, cls = 'sy ' + (SY.online ? (n ? 'wait' : 'ok') : 'off');
    el.className = cls; el.textContent = SY.online ? (n ? 'يُرسل ' + n : 'مباشر ✓') : (n ? 'بلا اتصال · ' + n : 'بلا اتصال');
  }
  function fetchT(url, opt) {
    var ac = window.AbortController ? new AbortController() : null, t = ac ? setTimeout(function () { ac.abort(); }, 15000) : 0;
    opt = opt || {}; if (ac) opt.signal = ac.signal;
    return fetch(url, opt).then(function (r) { clearTimeout(t); return r; }, function (e) { clearTimeout(t); throw e; });
  }
  function flush() {
    if (!SY.on || SY.busy || !ST.outbox.length) { badge(); return; }
    if (navigator.onLine === false) { SY.online = false; badge(); return; }
    SY.busy = true; var keys = ST.outbox.slice(0, 40), snap = keys.map(function (k) { return ST.store[k]; }).filter(Boolean);
    Promise.all(snap.map(function (rec) { return enc(rec).then(function (c) { return [cpath(rec), c]; }); })).then(function (pairs) {
      var body = {}; pairs.forEach(function (p2) { body[p2[0]] = p2[1]; });
      return fetchT(SY.base + '.json', { method: 'PATCH', body: JSON.stringify(body) });
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      snap.forEach(function (rec) { var k = rec.c + ':' + rec.u; if (ST.store[k] === rec) { var i = ST.outbox.indexOf(k); if (i >= 0) ST.outbox.splice(i, 1); } });
      SY.busy = false; SY.online = true; saveSoon(); badge(); if (ST.outbox.length) flush();
    }).catch(function () { SY.busy = false; SY.online = false; badge(); });
  }
  var ingestQ = [], ingestT = 0;
  function ingest(val) {
    if (typeof val !== 'string') return;
    dec(val).then(function (o) {
      if (!o || !o.c || o.u == null || typeof o.r !== 'number') return;
      if (mergeRec(o)) { ingestQ.push(1); if (!ingestT) ingestT = setTimeout(function () { ingestT = 0; ingestQ = []; derive(); saveSoon(); scheduleRender(); }, 30); }
    }).catch(function () { /* سجل تالف أو بمفتاح آخر: يُتجاهل */ });
  }
  function onSse(ev) {
    var m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (!m) return;
    var path = m.path || '/', d = m.data;
    if (path === '/') { if (d && typeof d === 'object') for (var k in d) { if (k.charAt(0) !== '_') ingest(d[k]); } else if (typeof d === 'string') { /* لا شيء */ } }
    else { var key = path.replace(/^\//, ''); if (key.indexOf('/') < 0 && key.charAt(0) !== '_') ingest(d); }
  }
  function openStreams() {
    SY.es.forEach(function (e) { try { e.close(); } catch (x) { /* */ } }); SY.es = []; SY.day = todayStr();
    if (!window.EventSource) { SY.online = false; badge(); return; }
    [SY.base + '/d/' + SY.day + '.json', SY.base + '/k.json'].forEach(function (u) {
      var e = new EventSource(u);
      e.onopen = function () { SY.online = true; badge(); flush(); };
      e.onerror = function () { SY.online = false; badge(); };
      e.addEventListener('put', onSse); e.addEventListener('patch', onSse);
      SY.es.push(e);
    });
  }
  function syncStart() {
    var c = PKG && PKG.sync; if (!c || !c.url || !c.room || !c.key || !(window.crypto && crypto.subtle)) return;
    SY.base = String(c.url).replace(/\/+$/, '') + '/sync/' + c.room; SY.on = true;
    crypto.subtle.importKey('raw', hex(c.key), 'AES-GCM', false, ['encrypt', 'decrypt']).then(function (k) {
      SY.key = k; openStreams(); flush();
      // أعد رفع ما لم يصل بعد (مثلًا بعد إغلاق الصفحة)
      for (var q in ST.store) { var r = ST.store[q]; if (r.dev === ST.device && r.ex === undefined && ST.outbox.indexOf(q) < 0 && !r.cloud) { /* السجلات القديمة تُرفع مرة واحدة */ } }
      setInterval(function () { if (todayStr() !== SY.day) openStreams(); else SY.es.forEach(function (e, i) { if (e.readyState === 2) { openStreams(); } }); flush(); }, 4000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) { openStreams(); flush(); } });
      window.addEventListener('online', function () { openStreams(); flush(); });
      window.addEventListener('offline', function () { SY.online = false; badge(); });
      if (!ST.cloudSeeded) { ST.cloudSeeded = 1; for (var z in ST.store) if (ST.store[z].dev === ST.device && ST.outbox.indexOf(z) < 0) ST.outbox.push(z); save(); flush(); }
    }).catch(function () { SY.on = false; });
  }

  /* ---------- تصدير الحضور (.gwatt مشفّر بمفتاح البرنامج) ---------- */
  function exportAtt() {
    if (!D.events.length && !D.incidents.length && !D.kit.length && !D.guests.length && !D.co.length) { toast('لا توجد تسجيلات للتصدير'); return; }
    if (!(window.crypto && crypto.subtle)) { toast('هذا المتصفح لا يدعم التصدير المشفّر'); return; }
    var doc = { format: 'gwatt', version: 1, device: ST.device, exported_at: nowLocal(), package_created_at: PKG.created_at, events: D.events, incidents: D.incidents, kit_events: D.kit, coach_sessions: D.co, guests: D.guests.map(function (g) { return { uid: g.uid, at: g.at, out_at: g.out_at, name: g.name, phone: g.phone, note: g.note, squad_id: g.squad_id, squad_name: g.squad_name }; }), sessions: D.sessions };
    var iv = crypto.getRandomValues(new Uint8Array(12)), nE = D.events.length, nI = D.incidents.length, nK = D.kit.length;
    crypto.subtle.importKey('raw', hex(EX_KEY), 'AES-GCM', false, ['encrypt']).then(function (k) { return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(JSON.stringify(doc))); }).then(function (ct) {
      var head = new TextEncoder().encode('GWA1'), out = new Uint8Array(4 + 12 + ct.byteLength); out.set(head, 0); out.set(iv, 4); out.set(new Uint8Array(ct), 16);
      var name = 'GoldenWolf-' + todayStr() + '-' + nowLocal().slice(11, 16).replace(':', '') + '.gwatt';
      function done() { for (var k in ST.store) ST.store[k].ex = ST.store[k].r; ST.lastExportAt = nowLocal(); save(); render(); toast('تم إنشاء الملف: ' + nE + ' حضور، ' + nI + ' حادثة، ' + nK + ' بذلة'); }
      function download() { var blob = new Blob([out], { type: 'application/octet-stream' }), a = h('a', { href: URL.createObjectURL(blob), download: name }); document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500); done(); }
      var file = null; try { file = new File([out], name, { type: 'application/octet-stream' }); } catch (e) { /* */ }
      if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'ملف الحضور' }).then(done).catch(function (err) { if (err && err.name === 'AbortError') return; download(); });
      } else download();
    }).catch(function (e) { toast('تعذّر التصدير: ' + e); });
  }

  start();
})();
